name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff mypy
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pip install -e . && mypy src/a2a_test

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest tests -q

  action-selftest:
    # Dogfood the GitHub Action: install from the action's own source tree
    # and run it against the in-repo fixture server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start fixture A2A server
        run: |
          python tests/server.py 8765 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/.well-known/agent-card.json > /dev/null && break
            sleep 0.5
          done
      - name: Run this repo's Action against the fixture
        uses: ./
        with:
          url: http://127.0.0.1:8765
          command: all
          format: tap
